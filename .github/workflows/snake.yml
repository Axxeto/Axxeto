name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *" # sekali sehari jam 00:00 UTC
  workflow_dispatch: {} # bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=react&bg_color=0A0E1A&title_color=4FC3F7&text_color=E8F4FD&icon_color=2196F3&border_color=2196F3&show_icons=true&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=react&bg_color=0A0E1A&title_color=4FC3F7&text_color=E8F4FD&border_color=2196F3&hide_border=false&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats cards" || exit 0
          git push
