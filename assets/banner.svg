<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .pixel { shape-rendering: crispEdges; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#23171B"/>

  <!-- Border frame (pixel style, double line) -->
  <rect x="4" y="4" width="892" height="192" fill="none" stroke="#4A2E35" stroke-width="4"/>
  <rect x="12" y="12" width="876" height="176" fill="none" stroke="#D32F2F" stroke-width="2"/>

  <!-- Decorative pixel corner accents -->
  <rect x="4" y="4" width="16" height="16" fill="#D32F2F"/>
  <rect x="880" y="4" width="16" height="16" fill="#D32F2F"/>
  <rect x="4" y="180" width="16" height="16" fill="#D32F2F"/>
  <rect x="880" y="180" width="16" height="16" fill="#D32F2F"/>

  <!-- ===== Pixel Tea Cup (left side, x offset ~90) ===== -->
  <g transform="translate(60, 90)">
    <!-- Saucer -->
    <rect x="-4" y="70" width="128" height="8" fill="#F5E6D3"/>
    <rect x="0" y="66" width="120" height="4" fill="#F5E6D3"/>
    <!-- Cup body -->
    <rect x="16" y="24" width="88" height="8" fill="#F5E6D3"/>
    <rect x="12" y="32" width="96" height="8" fill="#F5E6D3"/>
    <rect x="12" y="40" width="96" height="24" fill="#F5E6D3"/>
    <rect x="16" y="64" width="88" height="6" fill="#F5E6D3"/>
    <!-- Tea liquid -->
    <rect x="20" y="32" width="80" height="8" fill="#D32F2F"/>
    <!-- Cup shadow/detail -->
    <rect x="12" y="40" width="8" height="24" fill="#4A2E35" opacity="0.4"/>
    <!-- Handle -->
    <rect x="108" y="36" width="8" height="4" fill="#F5E6D3"/>
    <rect x="116" y="36" width="4" height="20" fill="#F5E6D3"/>
    <rect x="108" y="52" width="8" height="4" fill="#F5E6D3"/>
    <!-- Steam (pixel puffs, staggered) -->
    <rect x="24" y="14" width="8" height="8" fill="#F5E6D3" opacity="0.9"/>
    <rect x="24" y="2" width="8" height="8" fill="#F5E6D3" opacity="0.55"/>
    <rect x="60" y="14" width="8" height="8" fill="#F5E6D3" opacity="0.9"/>
    <rect x="60" y="-4" width="8" height="8" fill="#F5E6D3" opacity="0.55"/>
    <rect x="90" y="18" width="8" height="8" fill="#F5E6D3" opacity="0.8"/>
    <rect x="90" y="4" width="8" height="8" fill="#F5E6D3" opacity="0.4"/>
  </g>

  <!-- ===== Crimson ribbon bow accent (right side, triangle-style) ===== -->
  <g transform="translate(750, 65)">
    <!-- Left wing (triangle made of stacked pixel rows) -->
    <rect x="0" y="16" width="8" height="8" fill="#D32F2F"/>
    <rect x="8" y="12" width="8" height="16" fill="#D32F2F"/>
    <rect x="16" y="8" width="8" height="24" fill="#D32F2F"/>
    <rect x="24" y="4" width="8" height="32" fill="#D32F2F"/>
    <!-- Right wing (mirrored) -->
    <rect x="64" y="4" width="8" height="32" fill="#D32F2F"/>
    <rect x="72" y="8" width="8" height="24" fill="#D32F2F"/>
    <rect x="80" y="12" width="8" height="16" fill="#D32F2F"/>
    <rect x="88" y="16" width="8" height="8" fill="#D32F2F"/>
    <!-- Center knot -->
    <rect x="32" y="12" width="32" height="16" fill="#D32F2F"/>
    <rect x="40" y="16" width="16" height="8" fill="#4A2E35"/>
    <!-- Tails hanging down -->
    <rect x="40" y="28" width="6" height="14" fill="#D32F2F"/>
    <rect x="50" y="28" width="6" height="18" fill="#D32F2F"/>
  </g>

  <!-- ===== Title text (pixel font style via monospace) ===== -->
  <text x="220" y="90" font-family="'Courier New', monospace" font-weight="bold" font-size="34" fill="#D32F2F" letter-spacing="2">
    AXXET'S TEA CORNER
  </text>
  <text x="220" y="122" font-family="'Courier New', monospace" font-size="17" fill="#F5E6D3" letter-spacing="1">
    Coding Newbie &#8226; Brewing Code &amp; Chai
  </text>

  <!-- Pixel underline decoration -->
  <g transform="translate(220, 135)">
    <rect x="0" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="16" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="32" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="48" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="64" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="80" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="96" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="112" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="128" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="144" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="160" y="0" width="12" height="4" fill="#D32F2F"/>
    <rect x="176" y="0" width="12" height="4" fill="#D32F2F"/>
  </g>
</svg>
