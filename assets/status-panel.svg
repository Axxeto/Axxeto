<svg width="820" height="280" viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#E8F4FD"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2196F3" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect width="820" height="280" rx="14" fill="#0A0E1A"/>
  <rect width="820" height="280" rx="14" fill="url(#panelGlow)"/>
  <rect x="2" y="2" width="816" height="276" rx="12" fill="none" stroke="#2196F3" stroke-width="1.5" opacity="0.5"/>

  <!-- Corner brackets (HUD style) -->
  <g stroke="#4FC3F7" stroke-width="3" fill="none" filter="url(#softGlow)">
    <path d="M 14 30 L 14 14 L 30 14"/>
    <path d="M 790 14 L 806 14 L 806 30"/>
    <path d="M 806 250 L 806 266 L 790 266"/>
    <path d="M 30 266 L 14 266 L 14 250"/>
  </g>

  <!-- Header -->
  <text x="40" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="#E8F4FD" letter-spacing="1">CHARACTER STATUS</text>
  <rect x="40" y="52" width="120" height="3" fill="#2196F3"/>
  <circle cx="770" cy="38" r="5" fill="#4FC3F7" filter="url(#softGlow)"/>

  <!-- Class row -->
  <text x="40" y="86" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4FC3F7" letter-spacing="0.5">CLASS</text>
  <text x="140" y="86" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#E8F4FD">Code Apprentice</text>
  <text x="600" y="86" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4FC3F7">GUILD</text>
  <text x="660" y="86" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#E8F4FD">Open Source</text>

  <!-- HP Bar -->
  <text x="40" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4FC3F7" letter-spacing="0.5">HP</text>
  <rect x="90" y="110" width="600" height="16" rx="8" fill="#131826" stroke="#2196F3" stroke-width="1" opacity="0.6"/>
  <rect x="90" y="110" width="600" height="16" rx="8" fill="url(#hpGrad)" filter="url(#softGlow)"/>
  <text x="700" y="123" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#E8F4FD">100/100</text>

  <!-- MP Bar -->
  <text x="40" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4FC3F7" letter-spacing="0.5">MP</text>
  <rect x="90" y="144" width="600" height="16" rx="8" fill="#131826" stroke="#2196F3" stroke-width="1" opacity="0.6"/>
  <rect x="90" y="144" width="594" height="16" rx="8" fill="url(#mpGrad)" filter="url(#softGlow)"/>
  <text x="700" y="157" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#E8F4FD">99/99</text>

  <!-- EXP Bar (segmented) -->
  <text x="40" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4FC3F7" letter-spacing="0.5">EXP</text>
  <g>
    <rect x="90" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="140" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="190" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="240" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="290" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="340" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="390" y="178" width="46" height="14" rx="3" fill="#2196F3"/>
    <rect x="440" y="178" width="46" height="14" rx="3" fill="#131826" stroke="#2196F3" stroke-width="1" opacity="0.5"/>
    <rect x="490" y="178" width="46" height="14" rx="3" fill="#131826" stroke="#2196F3" stroke-width="1" opacity="0.5"/>
    <rect x="540" y="178" width="46" height="14" rx="3" fill="#131826" stroke="#2196F3" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="700" y="191" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#E8F4FD">Daily Quest</text>

  <!-- Bottom stat chips -->
  <g transform="translate(40, 214)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#131826" stroke="#4FC3F7" stroke-width="1" opacity="0.7"/>
    <text x="16" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4FC3F7" letter-spacing="1">FOCUS</text>
    <text x="16" y="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#E8F4FD">Web Systems</text>
  </g>
  <g transform="translate(210, 214)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#131826" stroke="#4FC3F7" stroke-width="1" opacity="0.7"/>
    <text x="16" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4FC3F7" letter-spacing="1">SPECIALTY</text>
    <text x="16" y="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#E8F4FD">Security</text>
  </g>
  <g transform="translate(380, 214)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#131826" stroke="#4FC3F7" stroke-width="1" opacity="0.7"/>
    <text x="16" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4FC3F7" letter-spacing="1">MOTTO</text>
    <text x="16" y="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#E8F4FD">Build. Secure.</text>
  </g>
  <g transform="translate(550, 214)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#131826" stroke="#4FC3F7" stroke-width="1" opacity="0.7"/>
    <text x="16" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4FC3F7" letter-spacing="1">STATUS</text>
    <text x="16" y="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#E8F4FD">Improving</text>
  </g>
</svg>
