<svg width="820" height="280" viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- richer multi-stop gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#080B16"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <radialGradient id="panelGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#2196F3" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2196F3" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1877D1"/>
      <stop offset="45%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#6FD0FF"/>
    </linearGradient>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="55%" stop-color="#7FD4FF"/>
      <stop offset="100%" stop-color="#EAF7FF"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#1877D1"/>
    </linearGradient>
    <!-- subtle top-sheen used on bars and chips for a "solid" feel -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161C2E"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>

    <!-- layered glow: wide soft halo + tight crisp core -->
    <filter id="haloWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="haloTight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect width="820" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="820" height="280" rx="14" fill="url(#panelGlow)"/>
  <rect x="2" y="2" width="816" height="276" rx="12" fill="none" stroke="#2196F3" stroke-width="1" opacity="0.35"/>
  <rect x="2" y="2" width="816" height="276" rx="12" fill="none" stroke="#4FC3F7" stroke-width="0.5" opacity="0.5"/>

  <!-- Corner brackets: soft halo behind + crisp thin line on top -->
  <g fill="none" stroke="#4FC3F7">
    <g stroke-width="3" opacity="0.35" filter="url(#haloWide)">
      <path d="M 14 30 L 14 14 L 30 14"/>
      <path d="M 790 14 L 806 14 L 806 30"/>
      <path d="M 806 250 L 806 266 L 790 266"/>
      <path d="M 30 266 L 14 266 L 14 250"/>
    </g>
    <g stroke-width="1.5">
      <path d="M 14 30 L 14 14 L 30 14"/>
      <path d="M 790 14 L 806 14 L 806 30"/>
      <path d="M 806 250 L 806 266 L 790 266"/>
      <path d="M 30 266 L 14 266 L 14 250"/>
    </g>
  </g>

  <!-- Header -->
  <text x="40" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="#EDF7FF" letter-spacing="1.5">CHARACTER STATUS</text>
  <rect x="40" y="52" width="120" height="2.5" rx="1.25" fill="#2196F3"/>
  <rect x="40" y="52" width="120" height="2.5" rx="1.25" fill="url(#sheen)"/>
  <circle cx="770" cy="38" r="4" fill="#4FC3F7" opacity="0.4" filter="url(#haloWide)"/>
  <circle cx="770" cy="38" r="4.5" fill="#8FE0FF" filter="url(#dotGlow)"/>

  <!-- thin separator under header -->
  <line x1="40" y1="64" x2="780" y2="64" stroke="#2196F3" stroke-width="0.5" opacity="0.18"/>

  <!-- Class row -->
  <text x="40" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5FBFF5" letter-spacing="1">CLASS</text>
  <text x="140" y="90" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#EDF7FF">Code Apprentice</text>
  <text x="600" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5FBFF5" letter-spacing="1">GUILD</text>
  <text x="660" y="90" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#EDF7FF">Open Source</text>

  <!-- thin separator -->
  <line x1="40" y1="102" x2="780" y2="102" stroke="#2196F3" stroke-width="0.5" opacity="0.12"/>

  <!-- HP Bar -->
  <text x="40" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5FBFF5" letter-spacing="1">HP</text>
  <rect x="90" y="114" width="600" height="16" rx="8" fill="#0D111C"/>
  <rect x="90" y="114" width="600" height="16" rx="8" fill="none" stroke="#2196F3" stroke-width="1" opacity="0.45"/>
  <rect x="90" y="114" width="600" height="16" rx="8" fill="none" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <rect x="91.5" y="115.5" width="597" height="13" rx="6.5" fill="url(#hpGrad)" opacity="0.25" filter="url(#haloTight)"/>
  <rect x="91.5" y="115.5" width="597" height="13" rx="6.5" fill="url(#hpGrad)"/>
  <rect x="91.5" y="115.5" width="597" height="6.5" rx="3.25" fill="url(#sheen)"/>
  <text x="700" y="127" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#EDF7FF">100/100</text>

  <!-- MP Bar -->
  <text x="40" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5FBFF5" letter-spacing="1">MP</text>
  <rect x="90" y="148" width="600" height="16" rx="8" fill="#0D111C"/>
  <rect x="90" y="148" width="600" height="16" rx="8" fill="none" stroke="#2196F3" stroke-width="1" opacity="0.45"/>
  <rect x="90" y="148" width="600" height="16" rx="8" fill="none" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <rect x="91.5" y="149.5" width="591" height="13" rx="6.5" fill="url(#mpGrad)" opacity="0.25" filter="url(#haloTight)"/>
  <rect x="91.5" y="149.5" width="591" height="13" rx="6.5" fill="url(#mpGrad)"/>
  <rect x="91.5" y="149.5" width="591" height="6.5" rx="3.25" fill="url(#sheen)"/>
  <text x="700" y="161" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#EDF7FF">99/99</text>

  <!-- EXP Bar (segmented) -->
  <text x="40" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5FBFF5" letter-spacing="1">EXP</text>
  <g>
    <rect x="90" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="90" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="138" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="138" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="186" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="186" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="234" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="234" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="282" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="282" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="330" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="330" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="378" y="182" width="44" height="14" rx="3" fill="url(#expGrad)"/>
    <rect x="378" y="182" width="44" height="7" rx="2" fill="url(#sheen)"/>
    <rect x="426" y="182" width="44" height="14" rx="3" fill="#0D111C" stroke="#2196F3" stroke-width="0.75" opacity="0.4"/>
    <rect x="474" y="182" width="44" height="14" rx="3" fill="#0D111C" stroke="#2196F3" stroke-width="0.75" opacity="0.4"/>
    <rect x="522" y="182" width="44" height="14" rx="3" fill="#0D111C" stroke="#2196F3" stroke-width="0.75" opacity="0.4"/>
  </g>
  <text x="700" y="195" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#EDF7FF">Daily Quest</text>

  <!-- Bottom stat chips -->
  <g transform="translate(40, 218)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="url(#chipGrad)"/>
    <rect x="0" y="0" width="150" height="42" rx="8" fill="none" stroke="#4FC3F7" stroke-width="0.75" opacity="0.5"/>
    <rect x="0.5" y="0.5" width="149" height="20" rx="7.5" fill="url(#sheen)"/>
    <text x="14" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#5FBFF5" letter-spacing="1.2">FOCUS</text>
    <text x="14" y="33" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#EDF7FF">Web Systems</text>
  </g>
  <g transform="translate(210, 218)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="url(#chipGrad)"/>
    <rect x="0" y="0" width="150" height="42" rx="8" fill="none" stroke="#4FC3F7" stroke-width="0.75" opacity="0.5"/>
    <rect x="0.5" y="0.5" width="149" height="20" rx="7.5" fill="url(#sheen)"/>
    <text x="14" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#5FBFF5" letter-spacing="1.2">SPECIALTY</text>
    <text x="14" y="33" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#EDF7FF">Security</text>
  </g>
  <g transform="translate(380, 218)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="url(#chipGrad)"/>
    <rect x="0" y="0" width="150" height="42" rx="8" fill="none" stroke="#4FC3F7" stroke-width="0.75" opacity="0.5"/>
    <rect x="0.5" y="0.5" width="149" height="20" rx="7.5" fill="url(#sheen)"/>
    <text x="14" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#5FBFF5" letter-spacing="1.2">MOTTO</text>
    <text x="14" y="33" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#EDF7FF">Build. Secure.</text>
  </g>
  <g transform="translate(550, 218)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="url(#chipGrad)"/>
    <rect x="0" y="0" width="150" height="42" rx="8" fill="none" stroke="#4FC3F7" stroke-width="0.75" opacity="0.5"/>
    <rect x="0.5" y="0.5" width="149" height="20" rx="7.5" fill="url(#sheen)"/>
    <text x="14" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#5FBFF5" letter-spacing="1.2">STATUS</text>
    <text x="14" y="33" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#EDF7FF">Improving</text>
  </g>
</svg>
