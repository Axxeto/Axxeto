    <text x="0" y="-1" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="9" fill="#FBD98A">QUEST</text>
    <text x="0" y="12" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#EFC670">Ongoing</text>
  </g>
