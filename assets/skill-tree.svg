    <path d="M740,430 L870,430" stroke="#F4A825" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.5"/>
    <path d="M740,430 L860,485" stroke="#F4A825" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.5"/>
