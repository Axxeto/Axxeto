<svg width="1200" height="870" viewBox="0 0 1200 870" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- glows -->
    <filter id="glowGreen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- gradients -->
    <radialGradient id="rootFill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5CF0CE"/>
      <stop offset="55%" stop-color="#2CC49B"/>
      <stop offset="100%" stop-color="#158567"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="55%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#141c33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- title font stack fallback handled inline -->
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1200" height="870" fill="url(#bgGrad)"/>
  <rect width="1200" height="870" fill="url(#vignette)"/>

  <!-- faint grid -->
  <g stroke="#7C6FF0" stroke-width="1" opacity="0.05">
    <g id="vlines"></g>
  </g>
  <g stroke="#7C6FF0" stroke-width="1" opacity="0.055">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="640" x2="1200" y2="640"/><line x1="0" y1="680" x2="1200" y2="680"/><line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="0" y1="760" x2="1200" y2="760"/><line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="40" y1="0" x2="40" y2="820"/><line x1="80" y1="0" x2="80" y2="820"/><line x1="120" y1="0" x2="120" y2="820"/>
    <line x1="160" y1="0" x2="160" y2="820"/><line x1="200" y1="0" x2="200" y2="820"/><line x1="240" y1="0" x2="240" y2="820"/>
    <line x1="280" y1="0" x2="280" y2="820"/><line x1="320" y1="0" x2="320" y2="820"/><line x1="360" y1="0" x2="360" y2="820"/>
    <line x1="400" y1="0" x2="400" y2="820"/><line x1="440" y1="0" x2="440" y2="820"/><line x1="480" y1="0" x2="480" y2="820"/>
    <line x1="520" y1="0" x2="520" y2="820"/><line x1="560" y1="0" x2="560" y2="820"/><line x1="600" y1="0" x2="600" y2="820"/>
    <line x1="640" y1="0" x2="640" y2="820"/><line x1="680" y1="0" x2="680" y2="820"/><line x1="720" y1="0" x2="720" y2="820"/>
    <line x1="760" y1="0" x2="760" y2="820"/><line x1="800" y1="0" x2="800" y2="820"/><line x1="840" y1="0" x2="840" y2="820"/>
    <line x1="880" y1="0" x2="880" y2="820"/><line x1="920" y1="0" x2="920" y2="820"/><line x1="960" y1="0" x2="960" y2="820"/>
    <line x1="1000" y1="0" x2="1000" y2="820"/><line x1="1040" y1="0" x2="1040" y2="820"/><line x1="1080" y1="0" x2="1080" y2="820"/>
    <line x1="1120" y1="0" x2="1120" y2="820"/><line x1="1160" y1="0" x2="1160" y2="820"/>
  </g>

  <!-- scattered stars -->
  <g fill="#C7D2E8">
    <circle cx="60" cy="60" r="1.3" opacity="0.5"/><circle cx="140" cy="200" r="1" opacity="0.35"/>
    <circle cx="1090" cy="90" r="1.4" opacity="0.5"/><circle cx="1000" cy="700" r="1.1" opacity="0.4"/>
    <circle cx="200" cy="720" r="1.2" opacity="0.4"/><circle cx="950" cy="200" r="1" opacity="0.3"/>
    <circle cx="80" cy="450" r="1.1" opacity="0.35"/><circle cx="1140" cy="500" r="1.3" opacity="0.4"/>
    <circle cx="650" cy="40" r="1" opacity="0.3"/><circle cx="500" cy="780" r="1.1" opacity="0.35"/>
