    <path d="M210,430 L80,430" stroke="#7C6FF0" stroke-width="1.6" opacity="0.4"/>
    <path d="M210,430 L90,485" stroke="#7C6FF0" stroke-width="1.6" opacity="0.4"/>

    <!-- GAMEDEV hub -> leaves -->
    <path d="M470,645 L310,715" stroke="#F4A825" stroke-width="1.6" opacity="0.45"/>
    <path d="M470,645 L470,752" stroke="#F4A825" stroke-width="1.6" opacity="0.45"/>
    <path d="M470,645 L630,715" stroke="#F4A825" stroke-width="1.6" opacity="0.45"/>

