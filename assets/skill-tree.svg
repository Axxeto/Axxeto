    <text x="75" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7C88A8" letter-spacing="1">CLASS</text>
    <text x="75" y="42" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="13" fill="#B7F5E4">Full-Stack Explorer</text>
  </g>

