  <text x="60" y="72" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="30" fill="#F3F6FC" letter-spacing="3">SKILL TREE</text>
  <rect x="62" y="86" width="150" height="4" rx="2" fill="#38D9A9"/>
  <text x="60" y="114" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7C6FF0" letter-spacing="1">// Axxet — Software Engineer in progress</text>

  <!-- top-right level badge -->
  <g transform="translate(1010,40)" filter="url(#softShadow)">
